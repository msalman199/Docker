version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    
  go-app:
    build:
      context: ../go-app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

networks:
  default:
    name: buildkit-network
