version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    networks:
      - webapp-network

  web:
    build: ./app
    environment:
      - DB_HOST=db
      - DB_USER=webapp
      - DB_PASSWORD=webapp123
      - DB_NAME=webapp_db
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - webapp-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword123
      - MYSQL_DATABASE=webapp_db
      - MYSQL_USER=webapp
      - MYSQL_PASSWORD=webapp123
    volumes:
      - db-data:/var/lib/mysql
      - ./database-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - webapp-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword123
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - webapp-network

volumes:
  db-data:

networks:
  webapp-network:
    driver: bridge
