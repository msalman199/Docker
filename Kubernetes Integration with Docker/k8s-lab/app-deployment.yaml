apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-lab-app-deployment
  labels:
    app: k8s-lab-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-lab-app
  template:
    metadata:
      labels:
        app: k8s-lab-app
    spec:
      containers:
      - name: k8s-lab-app
        image: k8s-lab-app:v1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
